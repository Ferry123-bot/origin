spring:
  application:
    name: yszx
  profiles:
    active: dev
  config:
    import: optional:file:./config/local.yml,optional:file:./backend/config/local.yml
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  jackson:
    time-zone: Asia/Shanghai

server:
  port: 8080
  tomcat:
    connection-timeout: 60s
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleteFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  ai:
    base-url: ${AI_BASE_URL:}
    model: ${AI_MODEL:}
    api-key: ${AI_API_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
