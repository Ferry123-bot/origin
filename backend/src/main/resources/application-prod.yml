spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:yszx}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectionTimeZone=UTC&useSSL=false
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3s

app:
  default-password: ${APP_DEFAULT_PASSWORD}
  jwt:
    portal-secret: ${JWT_PORTAL_SECRET}
    admin-secret: ${JWT_ADMIN_SECRET}
    access-token-minutes: 120
    refresh-token-days: 14
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:yszx}
  ai:
    base-url: ${AI_BASE_URL:}
    model: ${AI_MODEL:}
    api-key: ${AI_API_KEY:}
