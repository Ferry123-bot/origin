# 本机开发连接 deploy/docker-compose 暴露的端口（与 deploy/env/.env.example 默认一致）。
# 大模型密钥放在 backend/config/local.yml（不提交），或用环境变量 AI_BASE_URL、AI_MODEL、AI_API_KEY。
# 若本机 3306 已被占用：在 deploy/.env 改 MYSQL_PORT，启动后端时同样设置 MYSQL_PORT。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:yszx}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:yszx}
    password: ${MYSQL_PASSWORD:yszx_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:yszx_redis}
      timeout: 3s

app:
  default-password: ${APP_DEFAULT_PASSWORD:Admin@123456}
  jwt:
    portal-secret: ${JWT_PORTAL_SECRET:yszx-portal-dev-jwt-secret-key-32}
    admin-secret: ${JWT_ADMIN_SECRET:yszx-admin-dev-jwt-secret-key-032}
    access-token-minutes: 120
    refresh-token-days: 14
  sms:
    expose-code: true
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:yszx}
    secret-key: ${MINIO_SECRET_KEY:yszx_minio_pass}
    bucket: ${MINIO_BUCKET:yszx}

logging:
  level:
    com.yunshu.zhixue: debug
